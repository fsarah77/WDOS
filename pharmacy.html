<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Medicine Form</title>
    <link rel="stylesheet" href="styles/pharmacy.css">
    <link rel="stylesheet" href="styles/header-footer.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_package_v0.16(3)/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_package_v0.16(3)/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_package_v0.16(3)/favicon-16x16.png">
    <link rel="manifest" href="favicon_package_v0.16(3)/site.webmanifest">
    <link rel="mask-icon" href="favicon_package_v0.16(3)/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff"> 
</head>
<body>
    <header>
        <div class="logo-nav">
            <img src="images/logo2.png" alt="Lycasian Health Centre Logo" class="logo">
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
        </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="doctors.html">Doctors</a></li>
                    <li><a href="consultation.html">Consultation</a></li>
                    <li><a href="pharmacy.html">Pharmacy</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
    </header>

    <main>
      <div id="medicine-categories">
          <div class="category" id="analgesics">
              <h2>Analgesics</h2>
              <div class="medicine-list"></div>
          </div>
          <div class="category" id="antibiotics">
              <h2>Antibiotics</h2>
              <div class="medicine-list"></div>
          </div>
          <div class="category" id="antidepressants">
              <h2>Antidepressants</h2>
              <div class="medicine-list"></div>
          </div>
          <div class="category" id="antihistamines">
              <h2>Antihistamines</h2>
              <div class="medicine-list"></div>
          </div>
          <div class="category" id="antihypertensives">
              <h2>Antihypertensives</h2>
              <div class="medicine-list"></div>
          </div>
      </div>

      <div id="cart">
          <h2>Shopping Cart</h2>
          <table>
              <thead>
                  <tr>
                      <th>Medicine</th>
                      <th>Quantity</th>
                      <th>Price</th>
                  </tr>
              </thead>
              <tbody id="cart-items"></tbody>
          </table>
          <div id="total-price">Total: $0</div>
          <button id="buy-now">Buy Now</button>
          <button id="save-fav">Add to Favourites</button>
          <button id="check-fav">Check Favourites</button>
          <button id="apply-fav">Apply Favourites</button>
      </div>
  </main>

  <div id="favourites-section" style="display: none;">
    <h2>Your Favourites</h2>
    <table id="favourites-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody id="favourites-items">
           
        </tbody>
    </table>
  </div>
    
    <footer>
        <div class="footer-nav">
            <button>&larr;</button> 
            <button>&rarr;</button> 
        </div>
        <div class="footer-text">
            &copy; 2024 LHC. All rights reserved
        </div>
        <div class="footer-home">
            <button>&#8962;</button>
        </div>
    </footer> 

    <script src="scripts/data.json"></script>
    <script src="scripts/pharmacy.js" defer></script>
</body>

</html>
